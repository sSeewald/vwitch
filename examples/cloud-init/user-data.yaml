#cloud-config
# Generated by "vwitch cloud-init". Installs vwitch latest from
# https://github.com/sseewald/vwitch on Debian 12+ / Ubuntu 22.04+.
package_update: true
package_upgrade: true
packages:
  - curl
  - ca-certificates
runcmd:
  - curl -fsSL https://github.com/sseewald/vwitch/releases/latest/download/install.sh | sh -s -- --password-file /root/vwitch-admin-password
  - vwitch doctor || true
final_message: "vwitch installed. Admin password: /root/vwitch-admin-password. Add clients with: vwitch client add <name> --qr"
