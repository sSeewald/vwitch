#cloud-config
# Generated by "vwitch cloud-init". Installs vwitch latest from
# https://github.com/sseewald/vwitch on Debian 12+ / Ubuntu 22.04+.
package_update: true
package_upgrade: true
packages:
  - curl
  - ca-certificates
write_files:
  - path: /etc/vwitch/netbird.env
    permissions: "0600"
    content: |
      NB_SETUP_KEY=${NETBIRD_SETUP_KEY}
      NB_MANAGEMENT_URL=
runcmd:
  # NetBird for admin access (interface wt0); vwitch never touches its tables
  - curl -fsSL https://pkgs.netbird.io/install.sh | sh
  - . /etc/vwitch/netbird.env && netbird up --setup-key "$NB_SETUP_KEY" ${NB_MANAGEMENT_URL:+--management-url "$NB_MANAGEMENT_URL"} && rm -f /etc/vwitch/netbird.env
  - curl -fsSL https://github.com/sseewald/vwitch/releases/latest/download/install.sh | sh -s -- --password-file /root/vwitch-admin-password --language de --allow-direct --admin-interfaces lo,wt0 --lockdown-ssh
  - vwitch doctor || true
final_message: "vwitch installed. Admin password: /root/vwitch-admin-password. Add clients with: vwitch client add <name> --qr"
