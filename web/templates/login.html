{{define "content"}}
<form class="card stack" method="post" action="/login" hx-boost="false">
  <h1 class="login-title">{{t .Lang "login.title"}}</h1>
  <div class="field">
    <label for="user">{{t .Lang "login.username"}}</label>
    <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{.Data.Username}}" required {{if not .Data.Username}}autofocus{{end}}>
  </div>
  <div class="field">
    <label for="pw">{{t .Lang "login.password"}}</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required {{if .Data.Username}}autofocus{{end}}>
  </div>
  <button class="block">{{t .Lang "login.submit"}}</button>
  {{if .Data.NoPassword}}<p class="hint">{{t .Lang "login.nopassword"}}</p>{{end}}
</form>
{{end}}
