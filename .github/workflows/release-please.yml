name: Release Please

# Conventional commits on main (feat:, fix:, ...) keep a release PR up to date
# with the next version and CHANGELOG.md. Merging that PR tags the release,
# and the release job below builds and publishes it.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags pushed with GITHUB_TOKEN do not trigger workflows, so the release
  # is built here directly.
  release:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
